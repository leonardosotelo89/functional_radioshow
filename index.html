<html lang="en">
  <head>
<meta charset="UTF-8">
<meta 
name="viewport" 
content="width=device-width,

         initial-scale=1.0">



    <title>functional radioshow</title>
    <style>

*{margin:0px;padding:0px;box-sizing:border-box;}
      
body{
      background-color: rgb(0,0,0);
      color: lime;
} 
h2{
  animation:colores 36s 1s linear infinite;
}
@keyframes colores{
  from{
   filter: hue-rotate(0deg);
  }to{
    filter: hue-rotate(360deg);
  }
}
#displaydata{
height:100px;
font-size:40px;
font-family: Times New Roman ;
border:2px solid cyan;
color:lime;
background-color:darkblue ;
padding:30px;
 } 

#start{
  position: absolute ;
  left: 0px ;
  top: 0px;
  width: 100%;
  height: 100%;
  display: grid ;
  place-items: center ;
  border: none ;
}
#playnext{
  background-color:lime;
  border:4px solid lime;
  width: 250px;
  height: 250px;
  border-radius: 50%;
}

#stop{
  position: absolute ;
  left: 0px ;
  bottom: 0px;
  width: 100%;
  height: 25%;
  display: grid ;
  place-items: center ;
  border: none ;
}
#stopper{
  background-color:red;
  width: 100px;
  height: 100px ;
  border-radius: 0%;
  border:2px solid black;
}

    </style>
  </head>
  
  <body>
    
     <center><h2>global music | spanish intro</h2></center>
<div id="div1"></div>
<div id="div2"></div>
<div id="div3"></div>

<marquee id="displaydata" behavior="scroll" ></marquee>

  <div id="start">
    <button id="playnext" ></button>
  </div>

  <div id="stop">
    <button id="stopper" ></button>
  </div>



 <script src="devicetime.js"></script>
 <script src="list0to99.js"></script>
 <script src="list100to199.js"></script>
 <script src="list200to299.js"></script>




<script>
let mainaudio = new Audio()
let sounds = []
let already = [] 
let last = null
let timeinterval = 1



//list1 array from list0to99.js 
//list2 array from list100to199.js
//list3 array from list200to299.js

//alternative one spread operator 
sounds = [...list1,...list2] 
  
//alternative two push method
//sounds.push(...list1)
//sounds.push(...list2)

sounds.push(...list3)



/*
for marquee to work properly and don't see unwanted jumps we must 
add blank spaces before and after our text, 
there are two ways: &nbsp or &#160
*/



/*
   

*/
















function random(array){
/*
let randomcolor1 = `rgb(${parseInt(Math.random()*256)},${parseInt(Math.random()*256)},${parseInt(Math.random()*256)})`

let randomcolor2 = `rgb(${parseInt(Math.random()*256)},${parseInt(Math.random()*256)},${parseInt(Math.random()*256)})`
*/
let randomcolor1 = `hsl(${(Math.random()*360)}deg,100%,50%)`
let randomcolor2 = `hsl(${(Math.random()*360)}deg,100%,50%)`

let randomradial = `radial-gradient(circle at 50% 50%,${randomcolor1}, ${randomcolor2}) `

playnext.style.background = randomradial

  mainaudio.pause()
  mainaudio.currentTime = 0
  displaydata.innerHTML = '' 
  //div2.innerHTML = timeinterval 
  
  if(already.length === sounds.length){
    already = [] 
    already.push(last.song)
  } 
  
  let luck 
  let chosen 

  do{
      luck = parseInt(Math.random() * array.length)
      chosen = array[luck] 
  } while(already.includes(chosen.song)) 
  
  already.push(chosen.song) 
  last = chosen
  
  //div1.innerHTML = already.join('/')

  //displaydata.innerHTML = array[luck].text

  updateMarqueeText(array[luck].text) 
  
  let introduce = function() {    

    mainaudio.src =  array[luck].intro[parseInt(Math.random()*array[luck].intro.length)]

if(luck >= 100 && luck < 150){
mainaudio.src = "https://leonardosotelo89.github.io/functional_radioshow_archive1/intros100to149/" + array[luck].intro[parseInt(Math.random()*array[luck].intro.length)]
} 

if(luck >= 150 && luck < 200){
mainaudio.src = "https://leonardosotelo89.github.io/functional_radioshow_archive1/intros150to199/" + array[luck].intro[parseInt(Math.random()*array[luck].intro.length)]
} 

if(luck >= 200 && luck < 250){
mainaudio.src = "https://leonardosotelo89.github.io/functional_radioshow_archive2/intros200to249/" + array[luck].intro[parseInt(Math.random()*array[luck].intro.length)]
 // div3.innerHTML += mainaudio.src +"<br>" 
} 

if(luck >= 250 && luck < 300){
mainaudio.src = "https://leonardosotelo89.github.io/functional_radioshow_archive2/intros250to299/" + array[luck].intro[parseInt(Math.random()*array[luck].intro.length)]
//div3.innerHTML += mainaudio.src +"<br>" 
} 
    mainaudio.play()
    
    mainaudio.onended = function() {
      main() 
     } 
  }
  introduce()
  function main(){  

   mainaudio.src = array[luck].song  

if(luck >= 100 && luck < 200){
mainaudio.src = "https://leonardosotelo89.github.io/functional_radioshow_archive1/songs100to199/" + array[luck].song  
}

if(luck >= 200 && luck < 300){
mainaudio.src = "https://leonardosotelo89.github.io/functional_radioshow_archive2/songs200to299/" + array[luck].song  
//div3.innerHTML += mainaudio.src +"<br>" 
}

   mainaudio.play()  

   mainaudio.onended = function(){
     telltime()
   }
   } 
   function telltime(){

      
      updateMarqueeText('')

    timeinterval--
    
    if(timeinterval > 0)random(sounds)
    
    if(timeinterval == 0){

    //tell the time between 4 and 7 songs 
    timeinterval = parseInt(4 + (Math.random()*4)) 

    time()
    }

   } 
 } 
 
 /*
 document.body.onclick = function(){ 
   random(sounds) 
    // checkintros()
 } 
*/
  
playnext.onclick = function(){ 
   random(sounds) 
   this.style.background = 'blue'
 } 
 stopper.onclick = ()=>{
   //window.close()
   mainaudio.pause() 
   mainaudio.currentTime = 0
   updateMarqueeText("stopped") 
   playnext.style.background = 'lime' 
 }
 
  
  
 function updateMarqueeText(newText) { 
   const marquee = document.getElementById('displaydata'); 
  
   // Clone the marquee and update the content 
   const newMarquee = marquee.cloneNode(true); 
   newMarquee.innerHTML = newText; 
  
   // Replace the old marquee with the new one 
   marquee.parentNode.replaceChild(newMarquee, marquee); 
 } 
  
  
  function time() {
  let date = new Date();
  let hour = date.getHours();
  let minute = date.getMinutes();

//hour = 23
//minute = 59

    updateMarqueeText(
`&nbsp&nbsp&nbsp&#160&#160&#160 
${hour} : ${minute} 
&nbsp&nbsp&nbsp&#160&#160&#160`)

  tospeak = [
    timeintros[parseInt(Math.random()*timeintros.length)], 
    allhours[hour], 
    allminutes[minute], 
    repeat[parseInt(Math.random()*repeat.length)],
    allhours[hour], 
    allminutes[minute], 
    backtoshow[parseInt(Math.random()*backtoshow.length)]
    ];

  playAudioSequence();
}

function playAudioSequence() {
 if (tospeak.length === 0) {
  random(sounds);
  return
} 
  
  mainaudio.src = "time sounds/" + tospeak.shift();
  mainaudio.play();
  mainaudio.onended = playAudioSequence;
}




//debug zone
let current = 0
let checking = [...sounds[51].intro] 

function checkintros() {
if (checking.length === 0) {
  return document.body.innerHTML += "intros check complete" 
} 
  document.body.innerHTML += current 
  current++
  mainaudio.src = "sonidos mp3/" + checking.shift();
  mainaudio.play();
  mainaudio.onended = checkintros;
} 

</script>
